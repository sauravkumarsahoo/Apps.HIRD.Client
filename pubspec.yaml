name: hird
description: Mobile App for displaying data from HWiNFO using the HIRD Server.
publish_to: 'none'
version: 0.1.0+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  protobuf: ^2.0.1
  grpc: ^3.0.2
  network_info_plus: ^5.0.0
  fading_edge_scrollview: ^4.1.1
  connectivity_plus: ^5.0.0
  wakelock_plus: ^1.1.4
  syncfusion_flutter_sliders: ^21.1.35
  syncfusion_flutter_gauges: ^21.1.35
  get_it: ^7.2.0
  freezed_annotation: ^2.4.1
  animated_theme_switcher: ^2.0.9
  device_info_plus: ^9.0.0
  expandable: ^5.0.1
  ping_discover_network:
    git:
      url: https://github.com/deakjahn/ping_discover_network.git

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.6
  freezed: ^2.4.2
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/hw/cpu.png
    - assets/hw/gpu.png
    - assets/hw/hdd.png
    - assets/hw/m2_ssd.png
    - assets/hw/mobo.png
    - assets/hw/ram.png
    - assets/hw/sata_ssd.png
    - assets/hw/desktop.png
    - assets/hw/laptop.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
